<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taquia · Mesero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/waiterStyle.css}">
</head>
<body>

<div class="wrap">
    <h1>Pedidos listos</h1>

    <div class="order-list" th:if="${readyOrders != null and !#lists.isEmpty(readyOrders)}">

        <div class="order-card" th:each="order : ${readyOrders}" th:attr="id=${'order-' + order.id}">
            <div class="order-line table">Mesa <span th:text="${order.restaurantTable.number}">1</span></div>
            <div class="order-line order-id">Pedido #<span th:text="${order.id}">15</span></div>
            <div class="order-line status">Estado: <span class="status-value">LISTO</span></div>

            <button type="button"
                    class="deliver-btn"
                    th:attr="data-order-id=${order.id}"
                    onclick="entregarPedido(this)">[Entregar]</button>
        </div>

    </div>

    <div class="empty-state" th:if="${readyOrders == null or #lists.isEmpty(readyOrders)}">
        No hay pedidos listos para entregar...
    </div>
</div>

<script th:inline="javascript">
    function entregarPedido(btn){
        const orderId = btn.getAttribute('data-order-id');
        const card = document.getElementById('order-' + orderId);

        btn.disabled = true;
        btn.textContent = '[Entregando...]';

        fetch('/waiter/orders/' + orderId + '/delivered', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: 'DELIVERED' })
        })
            .then(res => {
                if(res.ok){
                    card.classList.add('delivered');
                    setTimeout(() => card.remove(), 250);
                } else {
                    btn.disabled = false;
                    btn.textContent = '[Entregar]';
                    alert('No se pudo marcar el pedido como entregado');
                }
            })
            .catch(err => {
                console.error('Error al entregar el pedido', err);
                btn.disabled = false;
                btn.textContent = '[Entregar]';
                alert('No se pudo marcar el pedido como entregado');
            });
    }
</script>

</body>
</html>
