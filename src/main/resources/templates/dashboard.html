<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taquia · Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboardStyle.css}">
</head>
<body>

<div class="admin-shell">

    <!-- ---- Nav lateral / barra superior en móvil ---- -->
    <aside class="sidebar">
        <div class="brand">Taquia</div>
        <nav class="nav-links">
            <a class="nav-link active" href="/admin" th:href="@{/admin}">Dashboard</a>
            <a class="nav-link" href="/kitchen" th:href="@{/kitchen}">Cocina</a>
            <a class="nav-link" href="/waiter" th:href="@{/waiter}">Mesero</a>
            <a class="nav-link" href="/admin/history" th:href="@{/orders-history}">Historial</a>
        </nav>
    </aside>

    <main class="content">

        <!-- ---- Estadísticas ---- -->
        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Pedidos hoy</div>
                <div class="stat-value" th:text="${stats.ordersToday}">42</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Ventas</div>
                <div class="stat-value chili">$<span th:text="${stats.totalSales}">5,820</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Pendientes</div>
                <div class="stat-value" th:text="${stats.pendingCount}">3</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Preparando</div>
                <div class="stat-value" th:text="${stats.preparingCount}">2</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Listos</div>
                <div class="stat-value" th:text="${stats.readyCount}">1</div>
            </div>
        </section>

        <!-- ---- Gestión de productos ---- -->
        <section class="products-section">
            <div class="section-header">
                <h1>Productos</h1>
                <button type="button" class="btn-primary" onclick="openProductModal()">+ Agregar producto</button>
            </div>

            <div class="table-wrap" th:if="${products != null and !#lists.isEmpty(products)}">
                <table class="products-table">
                    <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Estado</th>
                        <th class="col-actions">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="product : ${products}" th:attr="id=${'product-row-' + product.id}">
                        <td class="cell-name" th:text="${product.name}">Taco al pastor</td>
                        <td class="cell-price">$<span th:text="${product.price}">10</span></td>
                        <td>
                <span class="badge"
                      th:classappend="${product.available} ? 'available' : 'unavailable'"
                      th:text="${product.available} ? 'Disponible' : 'Agotado'">Disponible</span>
                        </td>
                        <td class="col-actions">
                            <button type="button"
                                    class="icon-btn edit"
                                    th:attr="data-id=${product.id}, data-name=${product.name}, data-price=${product.price}, data-available=${product.available}"
                                    onclick="openProductModal(this)">Editar</button>
                            <button type="button"
                                    class="icon-btn delete"
                                    th:attr="data-id=${product.id}, data-name=${product.name}"
                                    onclick="confirmDelete(this)">Eliminar</button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="empty-state" th:if="${products == null or #lists.isEmpty(products)}">
                Todavía no hay productos registrados.
            </div>
        </section>

    </main>
</div>

<!-- ---- Modal agregar / editar producto ---- -->
<div class="modal-overlay" id="productModal">
    <div class="modal">
        <h2 id="modalTitle">Agregar producto</h2>

        <form id="productForm" onsubmit="saveProduct(event)">
            <input type="hidden" id="productId" value="">

            <label class="field">
                <span>Nombre</span>
                <input type="text" id="productName" required placeholder="Ej. Taco al pastor">
            </label>

            <label class="field">
                <span>Precio</span>
                <input type="number" id="productPrice" step="0.01" min="0" required placeholder="0.00">
            </label>

            <label class="field checkbox-field">
                <input type="checkbox" id="productAvailable" checked>
                <span>Disponible</span>
            </label>

            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="closeProductModal()">Cancelar</button>
                <button type="submit" class="btn-primary">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script th:inline="javascript">
    const modal = document.getElementById('productModal');
    const form = document.getElementById('productForm');

    function openProductModal(editBtn){
        form.reset();
        document.getElementById('productId').value = '';

        if(editBtn){
            document.getElementById('modalTitle').textContent = 'Editar producto';
            document.getElementById('productId').value = editBtn.getAttribute('data-id');
            document.getElementById('productName').value = editBtn.getAttribute('data-name');
            document.getElementById('productPrice').value = editBtn.getAttribute('data-price');
            document.getElementById('productAvailable').checked = editBtn.getAttribute('data-available') === 'true';
        } else {
            document.getElementById('modalTitle').textContent = 'Agregar producto';
            document.getElementById('productAvailable').checked = true;
        }

        modal.classList.add('open');
    }

    function closeProductModal(){
        modal.classList.remove('open');
    }

    modal.addEventListener('click', (e) => {
        if(e.target === modal) closeProductModal();
    });

    function saveProduct(event){
        event.preventDefault();

        const id = document.getElementById('productId').value;
        const payload = {
            name: document.getElementById('productName').value,
            price: parseFloat(document.getElementById('productPrice').value),
            available: document.getElementById('productAvailable').checked
        };

        const url = id ? '/admin/products/' + id : '/admin/products';
        const method = id ? 'PUT' : 'POST';

        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
            .then(res => {
                if(res.ok){
                    window.location.reload();
                } else {
                    alert('No se pudo guardar el producto');
                }
            })
            .catch(err => {
                console.error('Error al guardar producto', err);
                alert('No se pudo guardar el producto');
            });
    }

    function confirmDelete(btn){
        const id = btn.getAttribute('data-id');
        const name = btn.getAttribute('data-name');

        if(!confirm('¿Eliminar "' + name + '"? Esta acción no se puede deshacer.')) return;

        fetch('/admin/products/' + id, { method: 'DELETE' })
            .then(res => {
                if(res.ok){
                    document.getElementById('product-row-' + id).remove();
                } else {
                    alert('No se pudo eliminar el producto');
                }
            })
            .catch(err => {
                console.error('Error al eliminar producto', err);
                alert('No se pudo eliminar el producto');
            });
    }
</script>

</body>
</html>
