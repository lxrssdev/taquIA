<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taquia · Cocina · Pedido</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/kitchen-detailStyle.css}">
</head>
<body>

<div class="wrap">
    <a class="back-link" href="/kitchen" th:href="@{/kitchen}">&larr; Pendientes</a>

    <h1>Pedido #<span th:text="${order.id}"></span></h1>
    <div class="table-line">Mesa <span th:text="${order.restaurantTable.number}">3</span></div>

    <div class="item-list">
        <div class="item-block" th:each="item : ${orderDetails}">
            <div class="item-line">
                <span class="qty" th:text="${item.quantity} + 'x'">3x</span>
                <span class="name" th:text="${item.product.name}">Pastor</span>
            </div>
            <div class="observation" th:if="${item.observations != null and !item.observations.isEmpty()}" th:text="${item.observations}">
            </div>
        </div>
    </div>

    <div class="divider">----------------</div>

    <button type="button"
            class="status-btn"
            th:attr="data-order-id=${order.id}"
            onclick="iniciarPreparacion(this)">[Iniciar preparación]</button>
</div>

<script th:inline="javascript">
    // Ciclo de estados de cocina. Ajusta según tus estados reales en el backend.
    const STATUS_FLOW = ['PENDING', 'PREPARING', 'READY'];
    const STATUS_LABEL = {
        'PENDING': 'Preparando',
        'PREPARING': 'Listo',
        'READY': 'Entregado'
    };

    function iniciarPreparacion(btn){
        const orderId = btn.getAttribute('data-order-id');

        btn.disabled = true;
        btn.textContent = '[Iniciando...]';

        fetch('/kitchen/orders/' + orderId + '/start', {
            method: 'POST'
        })
            .then(res => {
                if(res.ok){
                    window.location.href = '/kitchen';
                } else {
                    btn.disabled = false;
                    btn.textContent = '[Iniciar preparación]';
                    alert('No se pudo iniciar la preparación del pedido');
                }
            })
            .catch(err => {
                console.error('Error al iniciar preparación', err);
                btn.disabled = false;
                btn.textContent = '[Iniciar preparación]';
                alert('No se pudo iniciar la preparación del pedido');
            });
    }
</script>

</body>
</html>
